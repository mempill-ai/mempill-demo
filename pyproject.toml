[project]
name = "mempill-demo"
version = "0.1.0"
description = "Runnable demonstration of mempill temporal-validity + MCP integration"
requires-python = ">=3.11"
# mempill and mempill-mcp are unpublished (private wheel); path-installed by setup.sh.
# Do NOT add them here — they are not on PyPI.
dependencies = [
    "mcp>=1.9,<2",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo", "mcp", "console"]

[project.scripts]
mempill-console = "console.__main__:main"
