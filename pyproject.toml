[project]
name = "mempill-demo"
version = "0.1.0"
description = "Runnable demonstration of mempill temporal-validity + console agent"
requires-python = ">=3.11"
# mempill is published on PyPI (>=0.2.1) and listed below.
# mempill-mcp is NOT on PyPI (pure Python, unpublished); setup.sh path-installs it
# from the sibling repo ../mempill/mempill-mcp/ for the optional MCP demo.
dependencies = [
    "anthropic>=0.111,<1",
    "mcp>=1.9,<2",
    "mempill>=0.2.1,<0.3",
    "python-dotenv>=1.0",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2.6,<2",
    "langgraph-prebuilt>=1.1.0,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-anthropic>=1.4.7,<2",
]
crewai = [
    "crewai>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mempill_demo", "src/mempill_langgraph", "src/mempill_showcase"]

[tool.hatch.build]
sources = ["src"]

[project.scripts]
mempill-console = "mempill_demo.__main__:main"

[tool.pytest.ini_options]
markers = [
    "live: marks tests that require a live API key (deselect with '-m not live')",
]
