[project]
name = "mempill-demo"
version = "0.1.0"
description = "Runnable demonstration of mempill temporal-validity + console agent"
requires-python = ">=3.12"
# mempill 0.4.0 is NOT YET published on PyPI (deliberately unpublished pending this
# migration's verification). Until it is published, install from a local wheel built
# from the sibling mempill repo (scripts/setup.sh --local-engine). Do NOT run
# `uv lock` / `uv sync` against this pin until 0.4.0 is live on PyPI.
# mempill-mcp is NOT on PyPI (pure Python, unpublished); setup.sh path-installs it
# from the sibling repo ../mempill/mempill-mcp/ for the optional MCP demo.
dependencies = [
    "anthropic>=0.111,<1",
    "mcp>=1.9,<2",
    "mempill>=0.4.0,<0.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# langgraph: required by mempill_showcase (LangGraph CEO + HITL graph)
langgraph = [
    "langgraph>=1.2.6,<2",
    "langgraph-prebuilt>=1.1.0,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-anthropic>=1.4.7,<2",
    "langsmith>=0.1,<1",
]
# crewai extra removed — Wave B deleted the CrewAI integration
# observability: LangSmith tracing (no-op without LANGSMITH_API_KEY; configured from Settings)
observability = [
    "langsmith>=0.1,<1",
]
# live: all deps for live LLM + LangSmith runs (superset of observability)
live = [
    "langchain-anthropic>=1.4.7,<2",
    "langsmith>=0.1,<1",
]
# showcase: convenience bundle — installs everything needed for mempill_showcase
showcase = [
    "langgraph>=1.2.6,<2",
    "langgraph-prebuilt>=1.1.0,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-anthropic>=1.4.7,<2",
    "langsmith>=0.1,<1",
]
# studio: LangGraph Studio support — `pip install "langgraph-cli[inmem]"` then `langgraph dev`
studio = [
    "langgraph-cli[inmem]>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mempill_demo", "src/mempill_showcase"]

[tool.hatch.build]
sources = ["src"]

[project.scripts]
mempill-console = "mempill_demo.__main__:main"
mempill-showcase = "mempill_showcase.scenarios.executive_assistant:main"
mempill-showcase-compare = "mempill_showcase.scenarios.compare:main"
mempill-showcase-audit = "mempill_showcase.scenarios.compliance_replay:main"

[tool.pytest.ini_options]
markers = [
    "live: marks tests that require a live API key (deselect with '-m not live')",
]
